<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Filter Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#fff;font-family:Arial,sans-serif}.app{max-width:900px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{margin:0;font-size:22px}.sub{color:#999;font-size:12px;margin-top:4px}.add,button{background:#222227;color:#fff;border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.add{display:inline-block}input[type=file]{display:none}.stage{min-height:55vh;background:#151519;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage img,.stage video{max-width:100%;max-height:65vh;display:none;object-fit:contain}.empty{text-align:center;color:#777;padding:30px}.panel{background:#151519;border-radius:18px;padding:15px;margin-top:14px}.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px}.filters button{white-space:nowrap}.filters .active{background:#fff;color:#000}.label{font-size:13px;color:#aaa}.slider{width:100%;accent-color:#fff}.speed{display:flex;justify-content:space-between;margin-top:12px}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}.status{text-align:center;color:#888;font-size:12px;margin-top:10px}@media(max-width:600px){.stage{min-height:48vh}.actions{flex-direction:column}}</style></head><body><div class="app"><div class="top"><div><h1>Filter Studio</h1><div class="sub">One picture/video at a time • Original speed 1.0×</div></div><label class="add" for="media">＋ Add</label><input id="media" type="file" accept="image/*,video/*"></div><div class="stage"><div id="empty" class="empty">Choose one picture or video to start.</div><img id="img" alt="Preview"><video id="vid" controls playsinline></video></div><div class="panel"><div class="filters"><button class="active" data-f="none">Original</button><button data-f="grayscale(1)">B&W</button><button data-f="sepia(.75)">Sepia</button><button data-f="contrast(1.25) saturate(1.25)">Vivid</button><button data-f="brightness(1.12) contrast(1.08)">Bright</button><button data-f="saturate(.65)">Soft</button><button data-f="contrast(1.15) brightness(.92) saturate(1.25)">Cinematic</button></div><div class="label">Filter strength</div><input id="strength" class="slider" type="range" min="0" max="100" value="100"><div class="speed"><span>Video speed</span><b id="speedText">1.0×</b></div><input id="speed" class="slider" type="range" min=".25" max="2" step=".25" value="1"><div class="actions"><button id="reset">Reset</button><button id="save">Save / Export</button></div><div id="status" class="status">No media selected.</div></div></div><script>const media=document.getElementById('media'),img=document.getElementById('img'),vid=document.getElementById('vid'),empty=document.getElementById('empty'),strength=document.getElementById('strength'),speed=document.getElementById('speed'),speedText=document.getElementById('speedText'),status=document.getElementById('status');let file=null,url=null,chosen='none';function current(){return vid.style.display==='block'?vid:img}function apply(){current().style.filter=chosen==='none'?'none':chosen}media.onchange=()=>{file=media.files[0];if(!file)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);img.style.display='none';vid.style.display='none';empty.style.display='none';if(file.type.startsWith('image/')){img.src=url;img.style.display='block'}else if(file.type.startsWith('video/')){vid.src=url;vid.playbackRate=1;vid.style.display='block'}else return;chosen='none';strength.value=100;speed.value=1;speedText.textContent='1.0×';apply();status.textContent=file.name+' • Original 1.0×'};document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');chosen=b.dataset.f;apply()});speed.oninput=()=>{speedText.textContent=Number(speed.value).toFixed(1)+'×';if(vid.style.display==='block')vid.playbackRate=Number(speed.value)};strength.oninput=()=>{};document.getElementById('reset').onclick=()=>{chosen='none';strength.value=100;speed.value=1;speedText.textContent='1.0×';document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));document.querySelector('.filters button').classList.add('active');if(vid.style.display==='block')vid.playbackRate=1;if(file)apply();status.textContent=file?file.name+' • Reset to original 1.0×':'No media selected.'};function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('save').onclick=()=>{if(!file){status.textContent='Choose one picture or video first.';return}if(file.type.startsWith('image/')){const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.filter=img.style.filter||'none';x.drawImage(img,0,0);c.toBlob(b=>download(b,'filtered-image.png'),'image/png')}else{download(file,file.name);status.textContent='Original video saved at its original speed.'}};</script></body></html>
